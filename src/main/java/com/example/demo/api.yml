openapi: 3.0.3
info:
  title: Thumbnail Submission API
  version: "1.0.0"
paths:
  /submissions:
    post:
      operationId: createSubmission
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, email]
              properties:
                file:
                  type: string
                  format: binary
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Created submission successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: Invalid input or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listSubmissions
      responses:
        "200":
          description: List of submissions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
components:
  schemas:
    Submission:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        thumbnailKey:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string